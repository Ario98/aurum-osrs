services:
  osrs-terminal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osrs_flip_terminal
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/osrs_terminal.db
      TZ: UTC
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
