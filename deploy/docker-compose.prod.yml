services:
  osrs-terminal:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: osrs_flip_terminal
    env_file:
      - ../.env
    environment:
      DATABASE_PATH: /app/data/osrs_terminal.db
      TZ: UTC
    volumes:
      - osrs_data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  caddy:
    image: caddy:2-alpine
    container_name: osrs_caddy
    depends_on:
      osrs-terminal:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, e.g. flip.yourdomain.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  sqlite-backup:
    image: alpine:3.20
    container_name: osrs_sqlite_backup
    depends_on:
      - osrs-terminal
    volumes:
      - osrs_data:/app/data
      - osrs_backups:/backups
    command: >
      sh -c "
        apk add --no-cache sqlite >/dev/null &&
        while true; do
          sleep 86400;
          if [ -f /app/data/osrs_terminal.db ]; then
            ts=$$(date -u +%Y%m%d_%H%M%S);
            sqlite3 /app/data/osrs_terminal.db \".backup '/backups/osrs_$$ts.db'\";
            find /backups -name 'osrs_*.db' -mtime +7 -delete;
            echo \"[backup] Saved osrs_$$ts.db\";
          fi;
        done
      "
    restart: unless-stopped

volumes:
  osrs_data:
  osrs_backups:
  caddy_data:
  caddy_config:
